<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPath Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #0b1120;
      color: #f8fafc;
      padding: 16px;
      padding-bottom: 60px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }
    .brand { font-family: 'Fredoka', cursive; font-size: 22px; color: #38bdf8; }
    .xp-badge { background: #facc15; color: #000; font-weight: 800; padding: 4px 12px; border-radius: 20px; font-size: 13px; }
    .card {
      background: #151f38;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    h2, h3 { font-family: 'Fredoka', cursive; margin-bottom: 8px; }
    label { font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-top: 10px; text-transform: uppercase; }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0b1120;
      color: #fff;
      font-size: 14px;
    }
    .mascot-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .m-btn {
      background: #0b1120;
      border: 2px solid transparent;
      padding: 8px 4px;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .m-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
    }
    .btn-action {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: 'Fredoka', cursive;
      font-size: 17px;
      cursor: pointer;
      margin-top: 15px;
    }
    #screen-result { display: none; }
    .dialogue {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0b1120;
      padding: 12px;
      border-radius: 12px;
      border-left: 4px solid #facc15;
      margin-bottom: 15px;
    }
    .dialogue img { width: 55px; height: 55px; object-fit: contain; }
    .dialogue p { font-size: 13px; font-weight: 700; color: #facc15; }
    .bar-wrap { margin-bottom: 10px; }
    .bar-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.8s; }
    .timer-box {
      text-align: center;
      background: #0b1120;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
    }
    .clock { font-family: 'Fredoka', cursive; font-size: 45px; color: #fb923c; margin: 6px 0; }
    .t-btn { padding: 8px 18px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; color: #fff; }
    #quiz-wrap { display: none; background: #0b1120; padding: 14px; border-radius: 12px; margin-top: 15px; border: 1px solid #38bdf8; }
    .q-opt {
      width: 100%;
      background: #151f38;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">⚡ StudyPath Hub</div>
    <div class="xp-badge">⭐ XP: <span id="xp">100</span></div>
  </div>

  <div class="card" id="form-card">
    <h2>🎯 Plan Your Mission</h2>

    <label>Standard / Class</label>
    <select id="sel-class" onchange="applyClass()">
      <option value="6-8">Classes 6 to 8 (Middle)</option>
      <option value="9-10">Classes 9 & 10 (High School)</option>
      <option value="11-12-comm">Class 11 & 12: Commerce</option>
      <option value="11-12-sci">Class 11 & 12: Science</option>
      <option value="11-12-arts">Class 11 & 12: Arts & Humanities</option>
    </select>

    <label>Subject</label>
    <select id="sel-sub" onchange="applySubject()"></select>

    <label>Target Topic / Chapter</label>
    <select id="sel-ch"></select>

    <div style="display: flex; gap: 10px;">
      <div style="flex:1;">
        <label>Days</label>
        <input type="number" id="inp-days" value="4" min="1" max="30">
      </div>
      <div style="flex:1;">
        <label>Daily Hours</label>
        <input type="number" id="inp-hrs" value="2" min="1" max="10">
      </div>
    </div>

    <label>Choose Mascot</label>
    <div class="mascot-row">
      <button type="button" class="m-btn active" onclick="setMascot('luffy', this)">👒 Luffy</button>
      <button type="button" class="m-btn" onclick="setMascot('doraemon', this)">🔔 Doraemon</button>
      <button type="button" class="m-btn" onclick="setMascot('shinchan', this)">🍫 Shin-chan</button>
      <button type="button" class="m-btn" onclick="setMascot('pikachu', this)">⚡ Pikachu</button>
    </div>

    <button type="button" class="btn-action" onclick="makeChart()">🚀 Generate Action Chart</button>
  </div>

  <div class="card" id="screen-result">
    <h2>📊 Mission Action Chart</h2>

    <div class="dialogue">
      <img id="m-pic" src="" alt="Mascot">
      <p id="m-quote"></p>
    </div>

    <div class="bar-wrap">
      <div class="bar-info"><span>Concept Clarity & NCERT</span><span id="t1">40%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b1"></div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-info"><span>Question Practice & Numerical/Notes</span><span id="t2">35%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b2"></div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-info"><span>Speed Revision & Quiz Check</span><span id="t3">25%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b3"></div></div>
    </div>

    <div class="timer-box">
      <h3>⏱️ Focus Sprint Timer</h3>
      <div class="clock" id="timer-txt">25:00</div>
      <button type="button" class="t-btn" style="background:#22c55e;" onclick="startClock()">Start</button>
      <button type="button" class="t-btn" style="background:#ef4444;" onclick="pauseClock()">Pause</button>
    </div>

    <div id="quiz-wrap">
      <h3>🧠 Quick Checkpoint Quiz</h3>
      <p id="q-txt" style="margin: 8px 0; font-weight: 700;"></p>
      <div id="q-choices"></div>
    </div>
  </div>

  <script>
    var db = {
      "6-8": {
        "Mathematics": ["Integers & Fractions", "Algebra Basics", "Simple Equations", "Perimeter and Area"],
        "Science": ["Food & Nutrition", "Motion & Measurement", "Acids, Bases & Salts", "Light & Reflection"],
        "Social Science": ["Our Pasts (History)", "The Earth Our Habitat", "Civics: Social & Political Life"],
        "English": ["Honeysuckle Grammar", "Reading Comprehension", "Letter Writing"]
      },
      "9-10": {
        "Mathematics": ["Real Numbers & Polynomials", "Linear Equations in Two Variables", "Quadratic Equations", "Trigonometry Basics", "Statistics & Probability"],
        "Science": ["Chemical Reactions & Equations", "Acids, Bases & Salts", "Life Processes (Bio)", "Light - Reflection & Refraction", "Electricity"],
        "Social Science": ["Nationalism in India", "Resources & Development", "Democratic Politics", "Economics: Development"],
        "English": ["First Flight Prose", "Analytical Paragraph", "Grammar & Reported Speech"]
      },
      "11-12-comm": {
        "Accountancy": ["Rules of Debit & Credit", "Journal & Ledger", "Bank Reconciliation (BRS)", "Depreciation & Provisions", "Financial Statements"],
        "Business Studies": ["Nature & Purpose of Business", "Forms of Business Org", "Sources of Business Finance", "Internal Trade"],
        "Economics": ["Consumer Equilibrium & Demand", "Elasticity of Demand", "Production & Cost", "Measures of Central Tendency"],
        "English Core": ["The Portrait of a Lady", "We're Not Afraid to Die", "Note Making & Summary", "Notice Writing"]
      },
      "11-12-sci": {
        "Physics": ["Units & Measurement", "Motion in a Straight Line", "Laws of Motion", "Work, Energy & Power", "Gravitation"],
        "Chemistry": ["Some Basic Concepts of Chemistry", "Structure of Atom", "Chemical Bonding", "Thermodynamics"],
        "Mathematics": ["Sets & Relations", "Trigonometric Functions", "Complex Numbers", "Limits & Derivatives"],
        "Biology": ["The Living World", "Biological Classification", "Cell: Unit of Life", "Photosynthesis in Higher Plants"]
      },
      "11-12-arts": {
        "History": ["Writing and City Life", "An Empire Across Three Continents", "Nomadic Empires"],
        "Political Science": ["Constitution: Why and How?", "Rights in Indian Constitution", "Election and Representation"],
        "Geography": ["Geography as a Discipline", "Origin & Evolution of the Earth", "Interior of the Earth"]
      }
    };

    var buddies = {
      luffy: {
        img: "https://upload.wikimedia.org/wikipedia/en/c/cb/Monkey_D_Luffy.png",
        quote: "Ore wa Luffy! Target decide ho gaya, ab plan conquer karne se pehle rukna mana hai! 🍖🔥"
      },
      doraemon: {
        img: "https://upload.wikimedia.org/wikipedia/en/b/bd/Doraemon_character.png",
        quote: "Maine schedule bana diya hai! Nobita mat bano, focus sprint start karo! 🔔"
      },
      shinchan: {
        img: "https://upload.wikimedia.org/wikipedia/en/7/70/Shin-chan.png",
        quote: "Arre waah! Itna disciplined plan? Ek round timer complete karo, choco-chips milenge! 😂🍫"
      },
      pikachu: {
        img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png",
        quote: "Pika-Pikachu! Focus streak banaye rakho, quiz crack karke +50 XP earn karo! ⚡🌟"
      }
    };

    var currentMascot = 'luffy';

    function applyClass() {
      var cls = document.getElementById('sel-class').value;
      var subSel = document.getElementById('sel-sub');
      subSel.innerHTML = '';
      var subs = Object.keys(db[cls]);
      subs.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        subSel.appendChild(opt);
      });
      applySubject();
    }

    function applySubject() {
      var cls = document.getElementById('sel-class').value;
      var sub = document.getElementById('sel-sub').value;
      var chSel = document.getElementById('sel-ch');
      chSel.innerHTML = '';
      if (db[cls] && db[cls][sub]) {
        db[cls][sub].forEach(function(ch) {
          var opt = document.createElement('option');
          opt.value = ch;
          opt.textContent = ch;
          chSel.appendChild(opt);
        });
      }
    }

    function setMascot(key, btn) {
      currentMascot = key;
      document.querySelectorAll('.m-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }

    function makeChart() {
      var d = parseInt(document.getElementById('inp-days').value) || 1;
      var h = parseInt(document.getElementById('inp-hrs').value) || 1;
      var total = d * h;
      var sub = document.getElementById('sel-sub').value;
      var ch = document.getElementById('sel-ch').value;

      document.getElementById('screen-result').style.display = 'block';
      document.getElementById('m-pic').src = buddies[currentMascot].img;
      document.getElementById('m-quote').textContent = buddies[currentMascot].quote + ' (Target: ' + sub + ' - ' + ch + ')';

      document.getElementById('t1').textContent = (total * 0.4).toFixed(1) + ' hrs (40%)';
      document.getElementById('t2').textContent = (total * 0.35).toFixed(1) + ' hrs (35%)';
      document.getElementById('t3').textContent = (total * 0.25).toFixed(1) + ' hrs (25%)';

      setTimeout(function() {
        document.getElementById('b1').style.width = '40%';
        document.getElementById('b2').style.width = '35%';
        document.getElementById('b3').style.width = '25%';
      }, 100);

      document.getElementById('screen-result').scrollIntoView({ behavior: 'smooth' });
    }

    var timeLeft = 25 * 60;
    var timerId = null;

    function startClock() {
      if (timerId) return;
      timerId = setInterval(function() {
        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          alert("🎉 Time's up! Quick quiz unlocked!");
          openQuiz();
        } else {
          timeLeft--;
          var m = Math.floor(timeLeft / 60);
          var s = timeLeft % 60;
          document.getElementById('timer-txt').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
      }, 1000);
    }

    function pauseClock() {
      clearInterval(timerId);
      timerId = null;
    }

    function openQuiz() {
      var box = document.getElementById('quiz-wrap');
      box.style.display = 'block';
      document.getElementById('q-txt').textContent = "Revision Check: Is consistent self-study the key to mastering this chapter?";
      var cBox = document.getElementById('q-choices');
      cBox.innerHTML = '';

      var opt1 = document.createElement('button');
      opt1.className = 'q-opt';
      opt1.textContent = "Yes, regular practice and revision build full clarity!";
      opt1.onclick = function() {
        alert("🌟 Sahi jawab! +50 XP added!");
        var xp = document.getElementById('xp');
        xp.textContent = parseInt(xp.textContent) + 50;
      };

      var opt2 = document.createElement('button');
      opt2.className = 'q-opt';
      opt2.textContent = "No, one-night study is enough.";
      opt2.onclick = function() {
        alert("❌ Galat! Consistency se hi topper banenge!");
      };

      cBox.appendChild(opt1);
      cBox.appendChild(opt2);
      box.scrollIntoView({ behavior: 'smooth' });
    }

    applyClass();
  </script>
</body>
</html>
